site_name: Loud Outline
site_description: Like Quiet Outline, but louder! Shows each note's headings, tasks and lists as expandable nodes right in Obsidian's file explorer — no separate outline pane needed.
site_url: https://danrfletcher.github.io/obsidian-loud-outline/
repo_url: https://github.com/danrfletcher/obsidian-loud-outline
repo_name: danrfletcher/obsidian-loud-outline
edit_uri: edit/main/docs/docs/
markdown_extensions:
  - abbr
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - tables
  - toc:
      permalink: true
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
nav:
  - Overview: 'index.md'
  - Getting Started:
      - Installation: 'getting-started/installation.md'
      - Your First Look: 'getting-started/first-look.md'
  - How It Works:
      - Headings in the Tree: 'reference/headings.md'
      - Tasks and Lists: 'reference/tasks-and-lists.md'
      - Navigating: 'reference/navigation.md'
      - Compatibility: 'reference/compatibility.md'
  - Settings Reference: 'settings.md'
  - Examples: 'examples.md'
  - FAQ and Troubleshooting: 'faq.md'
  - Changelog: 'changelog.md'
plugins:
  - search
